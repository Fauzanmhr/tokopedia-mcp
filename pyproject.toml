[project]
name = "tokopedia-mcp"
version = "0.1.0"
description = "MCP server exposing Tokopedia product search, details, and reviews to LLM clients."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "curl-cffi>=0.13",
    "mcp>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
tokopedia-mcp = "tokopedia_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokopedia_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: requires network access to Tokopedia",
]
